<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4efe6">
<title>剪片看板</title>
<style>
:root{
  --bg:#f4efe6; --card:#fffdf8; --ink:#241f1a; --mute:#8a8176; --line:#e6dfd2;
  --accent:#d2553a; --accent2:#2f7d6b; --warn:#e0912b; --seg:#e3dccf; --shadow:0 6px 22px rgba(60,40,20,.10);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17140f; --card:#221e18; --ink:#f1ebe0; --mute:#a0978a; --line:#352f26; --accent:#ee7557; --accent2:#4fb59c; --warn:#f0a948; --seg:#3a342a; --shadow:0 6px 22px rgba(0,0,0,.4); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.45}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:.5px}
.sub{color:var(--mute);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px;cursor:pointer;border:1px solid var(--line)}
.cover{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#6e8f7a,#c9a96a);background-size:cover;background-position:center}
.cover .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0) 55%)}
.cover .no{position:absolute;left:14px;top:12px;font-size:12px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:3px 10px;backdrop-filter:blur(6px)}
.cover .ttl{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;font-size:22px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.cover .play{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.cover .play:after{content:"";border-left:11px solid #222;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.body{padding:14px 14px 16px}
.prog{display:flex;gap:4px;margin:2px 0 6px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--seg)}
.prog i.d{background:var(--accent2)}
.prog i.c{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.plabel{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute)}
.plabel b{color:var(--ink);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--seg);color:var(--ink)}
.chip.warn{background:var(--warn);color:#2b1d05;font-weight:700}
.chip.ver{background:transparent;border:1px solid var(--line);color:var(--mute)}
.last{margin-top:10px;font-size:14px}
.ago{color:var(--mute);font-size:12px;margin-top:4px}
/* 详情 */
#detail{position:fixed;inset:0;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;z-index:10;display:none;padding:max(12px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
#detail.on{display:block}
.back{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--accent);background:none;border:0;padding:8px 0;cursor:pointer}
.d h2{font-size:22px;margin:4px 0 6px}
video{width:100%;max-height:70vh;border-radius:16px;background:#000;display:block}
.sec{margin-top:22px}
.sec h3{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:600;letter-spacing:1px}
.stages{display:flex;gap:4px}
.stages div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.stages div i{display:block;height:8px;border-radius:4px;background:var(--seg);margin-bottom:5px}
.stages div.d i{background:var(--accent2)}
.stages div.c i{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.stages div.c{color:var(--ink);font-weight:700}
.now{margin-top:12px;font-size:15px}
.ask{background:var(--card);border:2px solid var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.ask b{display:block;font-size:15px;margin-bottom:6px}
.ask .opts{display:flex;flex-wrap:wrap;gap:6px}
.ask .opts span{background:var(--seg);border-radius:999px;padding:3px 10px;font-size:13px}
.ask.done{border-color:var(--line);opacity:.65}
.run{display:flex;flex-wrap:wrap;gap:8px}
.run span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl .it{position:relative;margin-bottom:16px}
.tl .it:before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg)}
.tl .it:first-child:before{background:var(--accent)}
.tl .v{font-size:12px;color:var(--mute)}
.tl .v b{color:var(--ink);background:var(--seg);border-radius:6px;padding:1px 7px;margin-right:6px}
.tl .w{font-size:15px;margin-top:3px}
.ov{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.form .row{display:flex;gap:8px;margin-bottom:8px}
.form input,.form textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.form input.t{width:96px;flex:none;text-align:center}
.form textarea{min-height:76px;resize:vertical}
.btn{font:inherit;font-size:15px;border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--seg);color:var(--ink);font-weight:500;padding:9px 12px;white-space:nowrap}
.btn:disabled{opacity:.5}
.cm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:14px}
.cm .h{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-bottom:3px}
.cm .st{border-radius:999px;padding:1px 8px;background:var(--warn);color:#2b1d05;font-weight:700}
.cm .st.ok{background:var(--accent2);color:#fff}
.cm .re{margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--seg);font-size:13px}
.msg{font-size:13px;color:var(--mute);margin-top:6px;min-height:18px}
.empty{color:var(--mute);font-size:14px;padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>剪片看板</h1>
  <div class="sub" id="sub">加载中…</div>
  <div id="list"></div>
</div>
<div id="detail"><div class="wrap d" id="dbody"></div></div>

<script>
var STAGES=["清点","镜头表","小样","母版","字效","验收","发布"];
var CFG=null, FILMS={}, ORDER=[], current=null, timer=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function q(u){return u+(u.indexOf("?")<0?"?":"&")+"t="+Date.now()}
function jget(u){return fetch(q(u),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function ago(iso){
  if(!iso)return"";var d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<90)return"刚刚更新";if(d<3600)return Math.round(d/60)+" 分钟前更新";if(d<86400)return Math.round(d/3600)+" 小时前更新";return Math.round(d/86400)+" 天前更新";
}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function stageIdx(s){var a=s.阶段||"",i=STAGES.indexOf(a);if(i>=0)return i;
  var M=[["导出",5],["验收",5],["发布",6],["清点",0],["镜头",1],["小样",2],["母版",3],["字效",4],["工程",4]];
  for(var k=0;k<M.length;k++){if(a.indexOf(M[k][0])>=0)return M[k][1]}return 0}
function progBar(s){var n=stageIdx(s),h="";for(var i=0;i<STAGES.length;i++){h+='<i class="'+(i<n?"d":i==n?(s.阶段=="发布"&&s.已发布?"d":"c"):"")+'"></i>'}return'<div class="prog">'+h+'</div>'}
function openCount(s){return(s.待拍板||[]).filter(function(p){return p.状态!="done"&&p.状态!="已定"}).length}
function pendingCm(id){var c=(FILMS[id].comments||[]).filter(function(x){return x.状态!="已处理"}).length;return c}
function lastWhat(s){var r=s.版本记录||[];return r.length?r[r.length-1]:null}

function renderList(){
  var h="";
  ORDER.forEach(function(id){
    var s=FILMS[id].status,n=openCount(s),lw=lastWhat(s),cv=s.总览图?'style="background-image:url(\''+esc("f/"+id+"/"+s.总览图)+'\')"':"";
    if(s.总览图&&/^https?:/.test(s.总览图))cv='style="background-image:url(\''+esc(s.总览图)+'\')"';
    h+='<div class="card" data-id="'+esc(id)+'">'+
      '<div class="cover" '+cv+'><div class="shade"></div><div class="no">'+esc(s.系列||("第 "+id.replace(/^f0*/,"")+" 部"))+'</div>'+(s.预览?'<div class="play"></div>':"")+'<div class="ttl">'+esc(s.片名)+'</div></div>'+
      '<div class="body">'+progBar(s)+
      '<div class="plabel"><b>'+esc(s.阶段)+'</b><span>'+esc(s.阶段说明||"")+'</span></div>'+
      '<div class="chips">'+(s.版本?'<span class="chip ver">'+esc(s.版本)+'</span>':"")+(n?'<span class="chip warn">待你拍板 '+n+'</span>':"")+(pendingCm(id)?'<span class="chip">留言待处理 '+pendingCm(id)+'</span>':"")+'</div>'+
      (lw?'<div class="last">'+esc(lw.改了什么)+'</div>':"")+
      '<div class="ago">'+esc(ago(s.更新))+'</div></div></div>';
  });
  document.getElementById("list").innerHTML=h||'<div class="empty">还没有片子推上来</div>';
  [].forEach.call(document.querySelectorAll(".card"),function(el){el.onclick=function(){location.hash=el.getAttribute("data-id")}});
}

function allComments(id){
  var srv=FILMS[id].comments||[],seen={};srv.forEach(function(c){seen[c.id]=1});
  var loc=lsGet("cm-"+id).filter(function(c){return!seen[c.id]});
  return loc.map(function(c){return{id:c.id,时间:c.时间,位置:c.位置,内容:c.内容,状态:"已发出",回复:""}}).concat(srv.slice().reverse());
}
function renderComments(id){
  var cs=allComments(id);
  return cs.map(function(c){
    var ok=c.状态=="已处理";
    return'<div class="cm"><div class="h"><span>'+esc(c.时间)+(c.位置?' · '+esc(c.位置):"")+'</span><span class="st '+(ok?"ok":"")+'">'+esc(c.状态)+'</span></div>'+esc(c.内容)+(c.回复?'<div class="re">片长：'+esc(c.回复)+'</div>':"")+'</div>'
  }).join("")||'<div class="empty" style="padding:12px 0">还没有留言</div>';
}
function renderDetail(id){
  var f=FILMS[id];if(!f){return}
  var s=f.status,n=stageIdx(s),h='<button class="back" id="bk">‹ 返回</button><h2>'+esc(s.片名)+'</h2>';
  var src=s.预览?(/^https?:/.test(s.预览)?s.预览:"f/"+id+"/"+s.预览):"";
  var poster=s.总览图?(/^https?:/.test(s.总览图)?s.总览图:"f/"+id+"/"+s.总览图):"";
  if(src)h+='<video id="vid" controls playsinline preload="metadata" src="'+esc(src)+'#t=0.1"></video>';
  else if(poster)h+='<img class="ov" src="'+esc(poster)+'">';
  var st="";STAGES.forEach(function(t,i){st+='<div class="'+(i<n?"d":i==n?"c":"")+'"><i></i>'+t+'</div>'});
  h+='<div class="sec"><div class="stages">'+st+'</div><div class="now"><b>'+esc(s.阶段)+'</b>'+(s.版本?' · '+esc(s.版本):"")+(s.阶段说明?' · '+esc(s.阶段说明):"")+'</div><div class="ago">'+esc(ago(s.更新))+'</div></div>';
  var asks=s.待拍板||[];
  if(asks.length){h+='<div class="sec"><h3>待你拍板</h3>'+asks.map(function(p){var dn=(p.状态=="done"||p.状态=="已定");return'<div class="ask'+(dn?" done":"")+'"><b>'+esc(p.问题)+'</b>'+((p.选项&&p.选项.length)?'<div class="opts">'+p.选项.map(function(o){return'<span>'+esc(o)+'</span>'}).join("")+'</div>':"")+(p.建议?'<div class="ago">建议：'+esc(p.建议)+'</div>':"")+'</div>'}).join("")+'<div class="ago">要拍板，直接在下面「留言」里写就行</div></div>'}
  var rn=s.在跑||[];
  if(rn.length)h+='<div class="sec"><h3>正在跑</h3><div class="run">'+rn.map(function(r){return'<span>'+esc((r.机器?r.机器+" · ":"")+r.谁+(r.做什么?"：":"")+(r.做什么||""))+'</span>'}).join("")+'</div></div>';
  h+='<div class="sec"><h3>留言（写给片长，如「1:22 字被挡」）</h3><div class="form"><div class="row"><input class="t" id="cat" placeholder="1:22" inputmode="text" autocomplete="off"><button class="btn ghost" id="grab">取视频当前时间</button></div><textarea id="ctx" placeholder="哪里不满意、想怎么改"></textarea><div style="display:flex;align-items:center;gap:10px;margin-top:8px"><button class="btn" id="send">发给片长</button><span class="msg" id="msg"></span></div></div><div id="cms">'+renderComments(id)+'</div></div>';
  var recs=(s.版本记录||[]).slice().reverse();
  h+='<div class="sec"><h3>每一版改了什么</h3><div class="tl">'+(recs.map(function(r){return'<div class="it"><div class="v">'+(r.版本?'<b>'+esc(r.版本)+'</b>':"")+esc(r.时间||"")+'</div><div class="w">'+esc(r.改了什么)+'</div></div>'}).join("")||'<div class="empty" style="padding:6px 0">还没有记录</div>')+'</div></div>';
  if(poster&&src)h+='<div class="sec"><h3>总览图</h3><a href="'+esc(poster)+'" target="_blank"><img class="ov" src="'+esc(poster)+'"></a></div>';
  document.getElementById("dbody").innerHTML=h;
  document.getElementById("bk").onclick=function(){location.hash=""};
  document.getElementById("grab").onclick=function(){var v=document.getElementById("vid");if(!v){return}var t=Math.floor(v.currentTime),m=Math.floor(t/60),ss=t%60;document.getElementById("cat").value=m+":"+(ss<10?"0":"")+ss};
  document.getElementById("send").onclick=function(){sendComment(id)};
}
function sendComment(id){
  var at=document.getElementById("cat").value.trim(),tx=document.getElementById("ctx").value.trim(),msg=document.getElementById("msg"),b=document.getElementById("send");
  if(!tx){msg.textContent="先写点内容";return}
  b.disabled=true;msg.textContent="发送中…";
  var body={topic:CFG.topic,title:"看板留言",message:JSON.stringify({film:id,at:at,text:tx})};
  fetch(CFG.ntfy+"/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(ev){
    var l=lsGet("cm-"+id);var d=new Date();l.push({id:ev.id,时间:(d.getMonth()+1<10?"0":"")+(d.getMonth()+1)+"-"+(d.getDate()<10?"0":"")+d.getDate()+" "+(d.getHours()<10?"0":"")+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes(),位置:at,内容:tx});lsSet("cm-"+id,l);
    document.getElementById("ctx").value="";msg.textContent="已发出，片长下次开工会读到";document.getElementById("cms").innerHTML=renderComments(id);b.disabled=false;
  }).catch(function(e){msg.textContent="没发出去（"+e.message+"），再试一次";b.disabled=false});
}
function route(){
  var id=location.hash.replace("#","");
  var d=document.getElementById("detail");
  if(id&&FILMS[id]){current=id;renderDetail(id);d.classList.add("on");d.scrollTop=0;document.body.style.overflow="hidden"}
  else{current=null;d.classList.remove("on");document.body.style.overflow="";var v=document.getElementById("vid");if(v)v.pause();document.getElementById("dbody").innerHTML=""}
}
function load(first){
  return Promise.all([jget("index.json"),jget("config.json")]).then(function(r){
    CFG=r[1];var ids=r[0].films||[];
    return Promise.all(ids.map(function(id){return Promise.all([jget("f/"+id+"/status.json"),jget("f/"+id+"/comments.json").catch(function(){return[]})]).then(function(x){return{id:id,status:x[0],comments:x[1]}})})).then(function(arr){
      var keep=current&&document.getElementById("send")&&(document.getElementById("ctx").value||"")!=="";
      ORDER=ids;arr.forEach(function(f){FILMS[f.id]=f});
      document.getElementById("sub").textContent="春节旅行系列 · 共 "+ids.length+" 部 · "+(r[0].更新?ago(r[0].更新):"");
      renderList();
      if(first)route();else if(current&&!keep){var v=document.getElementById("vid");if(!v||v.paused){renderDetail(current)}}
    });
  }).catch(function(e){document.getElementById("sub").textContent="加载失败，下拉刷新重试（"+e.message+"）"});
}
window.addEventListener("hashchange",route);
load(true);
timer=setInterval(function(){if(!document.hidden)load(false)},60000);
</script>
</body>
</html>
